<svg width="1200" height="1320" viewBox="0 0 1200 1320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering pipeline from signal model to verified metrics</title>
  <desc id="desc">A vertical engineering pipeline: Signal and RF problem, MATLAB model, C++ DSP, fixed-point design, Verilog FPGA, measurement, and BER EVM SNR reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0a1f38"/>
      <stop offset="1" stop-color="#12365b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(230 180) rotate(35) scale(620 360)">
      <stop stop-color="#1bb6ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#1bb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 1050) rotate(-25) scale(620 420)">
      <stop stop-color="#7c5cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-15%" width="110%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#86e6ff"/>
    </marker>
    <style>
      .title{font:800 46px Arial, DejaVu Sans, sans-serif;fill:#f1fbff;letter-spacing:.2px}
      .subtitle{font:400 22px Arial, DejaVu Sans, sans-serif;fill:#b9e7f7}
      .card{fill:#0e2946;stroke:#67d8ff;stroke-width:2.4;filter:url(#shadow)}
      .final{fill:#14284d;stroke:#b09aff;stroke-width:2.4;filter:url(#shadow)}
      .numCircle{fill:#1a6f98;stroke:#85e6ff;stroke-opacity:.9;stroke-width:1.6}
      .num{font:800 18px Arial, DejaVu Sans, sans-serif;fill:#f5fdff;text-anchor:middle;dominant-baseline:middle}
      .stage{font:800 30px Arial, DejaVu Sans, sans-serif;fill:#f4fcff}
      .body{font:400 21px Arial, DejaVu Sans, sans-serif;fill:#c9e4f0}
      .metric{font:700 20px Arial, DejaVu Sans, sans-serif;fill:#98edff}
      .arrow{stroke:#86e6ff;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}
      .feedback{stroke:#b59cff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .feedbackText{font:400 20px Arial, DejaVu Sans, sans-serif;fill:#d3caff}
      .footerStrong{font:800 22px Arial, DejaVu Sans, sans-serif;fill:#f4fcff}
      .footer{font:400 22px Arial, DejaVu Sans, sans-serif;fill:#c7e6f2}
      .grid{stroke:#70cfff;stroke-opacity:.13;stroke-width:1}
      .icon{stroke:#85e6ff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .icon2{stroke:#b59cff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    </style>
  </defs>

  <rect width="1200" height="1320" fill="url(#bg)"/>
  <rect width="1200" height="1320" fill="url(#glowA)"/>
  <rect width="1200" height="1320" fill="url(#glowB)"/>

  <g>
    <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200M0 720H1200M0 800H1200M0 880H1200M0 960H1200M0 1040H1200M0 1120H1200M0 1200H1200M0 1280H1200"/>
    <path class="grid" d="M80 0V1320M160 0V1320M240 0V1320M320 0V1320M400 0V1320M480 0V1320M560 0V1320M640 0V1320M720 0V1320M800 0V1320M880 0V1320M960 0V1320M1040 0V1320M1120 0V1320"/>
  </g>

  <rect x="30" y="30" width="1140" height="1260" rx="30" stroke="#67d8ff" stroke-opacity="0.30" stroke-width="2"/>
  <text x="72" y="94" class="title">Engineering Pipeline</text>
  <text x="74" y="134" class="subtitle">signal model → software → fixed-point → FPGA → measurement → metrics</text>

  <g transform="translate(84 178)">
    <g transform="translate(0 0)">
      <rect class="card" width="1032" height="118" rx="24"/>
      <circle class="numCircle" cx="56" cy="59" r="27"/><text class="num" x="56" y="59">01</text>
      <path class="icon" d="M120 60 C144 24 166 96 190 60 S238 24 262 60"/>
      <text x="320" y="48" class="stage">Signal / RF problem</text>
      <text x="320" y="82" class="body">Define channel, impairments, constraints and measurable engineering goals.</text>
      <text x="805" y="82" class="metric">Output: requirements</text>
    </g>

    <path class="arrow" d="M516 130 V163"/>

    <g transform="translate(0 178)">
      <rect class="card" width="1032" height="118" rx="24"/>
      <circle class="numCircle" cx="56" cy="59" r="27"/><text class="num" x="56" y="59">02</text>
      <path class="icon" d="M122 84H260M122 84V30"/><path class="icon2" d="M132 74 L162 58 L194 66 L226 42 L258 34"/>
      <text x="320" y="48" class="stage">MATLAB / Simulink reference</text>
      <text x="320" y="82" class="body">Build golden model, diagnostic plots and deterministic test vectors.</text>
      <text x="805" y="82" class="metric">Output: vectors</text>
    </g>

    <path class="arrow" d="M516 308 V341"/>

    <g transform="translate(0 356)">
      <rect class="card" width="1032" height="118" rx="24"/>
      <circle class="numCircle" cx="56" cy="59" r="27"/><text class="num" x="56" y="59">03</text>
      <text x="128" y="76" style="font:800 52px Arial,DejaVu Sans,sans-serif;fill:#85e6ff">{ }</text>
      <circle class="icon" cx="242" cy="60" r="21"/>
      <text x="320" y="48" class="stage">C++ DSP implementation</text>
      <text x="320" y="82" class="body">Implement deterministic kernels with tests, CLI tools and benchmarks.</text>
      <text x="805" y="82" class="metric">Output: software</text>
    </g>

    <path class="arrow" d="M516 486 V519"/>

    <g transform="translate(0 534)">
      <rect class="card" width="1032" height="118" rx="24"/>
      <circle class="numCircle" cx="56" cy="59" r="27"/><text class="num" x="56" y="59">04</text>
      <text x="126" y="51" style="font:800 23px Arial,DejaVu Sans,sans-serif;fill:#85e6ff">Q1.15</text>
      <text x="126" y="83" style="font:800 23px Arial,DejaVu Sans,sans-serif;fill:#b59cff">sat / round</text>
      <text x="320" y="48" class="stage">Fixed-point design</text>
      <text x="320" y="82" class="body">Choose Q-format, scaling, rounding, saturation and error budget.</text>
      <text x="805" y="82" class="metric">Output: budget</text>
    </g>

    <path class="arrow" d="M516 664 V697"/>

    <g transform="translate(0 712)">
      <rect class="card" width="1032" height="118" rx="24"/>
      <circle class="numCircle" cx="56" cy="59" r="27"/><text class="num" x="56" y="59">05</text>
      <rect x="132" y="36" width="84" height="62" rx="9" fill="#143c5f" stroke="#85e6ff" stroke-width="3.5"/>
      <path class="icon" d="M108 48H132M108 64H132M108 80H132M216 48H240M216 64H240M216 80H240"/>
      <text x="320" y="48" class="stage">Verilog / FPGA architecture</text>
      <text x="320" y="82" class="body">Map stable DSP blocks to streaming RTL, latency checks and testbenches.</text>
      <text x="805" y="82" class="metric">Output: RTL</text>
    </g>

    <path class="arrow" d="M516 842 V875"/>

    <g transform="translate(0 890)">
      <rect class="card" width="1032" height="118" rx="24"/>
      <circle class="numCircle" cx="56" cy="59" r="27"/><text class="num" x="56" y="59">06</text>
      <rect x="118" y="34" width="142" height="68" rx="11" fill="#143c5f" stroke="#85e6ff" stroke-width="3.5"/>
      <path class="icon2" d="M132 70 C152 34 172 104 192 70 S234 34 254 70"/>
      <text x="320" y="48" class="stage">Measurement and verification</text>
      <text x="320" y="82" class="body">Compare model, C++, RTL and real or synthetic signal captures.</text>
      <text x="805" y="82" class="metric">Output: report</text>
    </g>

    <path class="arrow" d="M516 1020 V1053"/>

    <g transform="translate(0 1068)">
      <rect class="final" width="1032" height="128" rx="24"/>
      <circle class="numCircle" cx="56" cy="64" r="27"/><text class="num" x="56" y="64">07</text>
      <path class="icon" d="M118 69H260M189 28V110"/>
      <circle cx="154" cy="48" r="6" fill="#85e6ff"/><circle cx="224" cy="48" r="6" fill="#85e6ff"/><circle cx="154" cy="92" r="6" fill="#b59cff"/><circle cx="224" cy="92" r="6" fill="#b59cff"/>
      <text x="320" y="50" class="stage">BER / EVM / SNR reports</text>
      <text x="320" y="86" class="body">Turn metrics, assumptions and limitations into engineering conclusions.</text>
      <text x="805" y="86" class="metric">Output: artifacts</text>
    </g>
  </g>

  <path class="feedback" d="M1115 1222 H1145 V238 H1120"/>
  <text x="72" y="1262" class="footerStrong">Core idea:</text>
  <text x="190" y="1262" class="footer">algorithms, software, hardware and metrics stay aligned through reproducible evidence.</text>
</svg>
