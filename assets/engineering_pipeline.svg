<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering pipeline</title>
  <desc id="desc">Compact DSP and FPGA engineering pipeline from RF problem to verified metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0a2038"/>
      <stop offset="1" stop-color="#102d4d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 105) rotate(25) scale(470 220)">
      <stop stop-color="#1bb6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1bb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 365) rotate(-20) scale(430 220)">
      <stop stop-color="#7c5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7 Z" fill="#86e6ff"/>
    </marker>
    <filter id="shadow" x="-6%" y="-16%" width="112%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font:800 36px Arial,DejaVu Sans,sans-serif;fill:#f1fbff}
      .subtitle{font:400 17px Arial,DejaVu Sans,sans-serif;fill:#b9e7f7}
      .card{fill:#0e2946;stroke:#67d8ff;stroke-width:2;filter:url(#shadow)}
      .final{fill:#14284d;stroke:#b09aff;stroke-width:2;filter:url(#shadow)}
      .badge{fill:#1a6f98;stroke:#85e6ff;stroke-width:1.3}
      .badge2{fill:#1b3768;stroke:#b59cff;stroke-width:1.3}
      .num{font:800 12px Arial,DejaVu Sans,sans-serif;fill:#f5fdff;text-anchor:middle;dominant-baseline:middle}
      .stage{font:800 22px Arial,DejaVu Sans,sans-serif;fill:#f4fcff;text-anchor:middle;dominant-baseline:middle}
      .hint{font:400 14px Arial,DejaVu Sans,sans-serif;fill:#c9e4f0;text-anchor:middle}
      .arrow{stroke:#86e6ff;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .footerStrong{font:800 16px Arial,DejaVu Sans,sans-serif;fill:#f4fcff}
      .footer{font:400 16px Arial,DejaVu Sans,sans-serif;fill:#c7e6f2}
      .grid{stroke:#70cfff;stroke-opacity:.10;stroke-width:1}
      .mini{stroke:#86e6ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .mini2{stroke:#b59cff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .dot{fill:#86e6ff}
      .dot2{fill:#b59cff}
      .qtxt{font:800 14px Arial,DejaVu Sans,sans-serif;fill:#b59cff;text-anchor:middle;dominant-baseline:middle}
      .code{font:800 20px Arial,DejaVu Sans,sans-serif;fill:#86e6ff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#glowA)"/>
  <rect width="1200" height="460" fill="url(#glowB)"/>
  <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
  <path class="grid" d="M80 0V460M160 0V460M240 0V460M320 0V460M400 0V460M480 0V460M560 0V460M640 0V460M720 0V460M800 0V460M880 0V460M960 0V460M1040 0V460M1120 0V460"/>
  <rect x="24" y="24" width="1152" height="412" rx="26" stroke="#67d8ff" stroke-opacity="0.28" stroke-width="2"/>

  <text x="64" y="72" class="title">Engineering Pipeline</text>
  <text x="66" y="101" class="subtitle">model → software → fixed-point → FPGA → measurement → metrics</text>

  <g transform="translate(72 145)">
    <g>
      <rect class="card" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">01</text>
      <circle class="badge" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <path class="mini" d="M191 0 C197 -10 203 10 209 0 S221 -10 227 0"/>
      <text x="120" y="43" class="stage">Signal / RF</text>
      <text x="120" y="70" class="hint">problem definition</text>
    </g>

    <g transform="translate(272 0)">
      <rect class="card" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">02</text>
      <circle class="badge2" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <path class="mini" d="M190 10H225M190 10V-10"/><path class="mini2" d="M194 6 L202 -1 L211 3 L219 -7 L226 -10"/>
      <text x="120" y="43" class="stage">MATLAB</text>
      <text x="120" y="70" class="hint">golden reference</text>
    </g>

    <g transform="translate(544 0)">
      <rect class="card" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">03</text>
      <circle class="badge" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <text class="code" x="200" y="0">{ }</text>
      <circle class="mini" cx="226" cy="0" r="7"/>
      <text x="120" y="43" class="stage">C++ DSP</text>
      <text x="120" y="70" class="hint">tests and benchmarks</text>
    </g>

    <g transform="translate(816 0)">
      <rect class="card" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">04</text>
      <circle class="badge2" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <text class="qtxt" x="206" y="0">Q</text>
      <path class="mini" d="M225 -9V9"/>
      <text x="120" y="43" class="stage">Fixed-point</text>
      <text x="120" y="70" class="hint">error budget</text>
    </g>

    <path class="arrow" d="M246 43 H262"/>
    <path class="arrow" d="M518 43 H534"/>
    <path class="arrow" d="M790 43 H806"/>
  </g>

  <path class="arrow" d="M1008 239 V267 H936"/>

  <g transform="translate(208 292)">
    <g>
      <rect class="card" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">05</text>
      <circle class="badge" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <rect x="192" y="-11" width="26" height="22" rx="4" fill="#12395a" stroke="#86e6ff" stroke-width="2"/>
      <path class="mini" d="M185 -6H192M185 0H192M185 6H192M218 -6H225M218 0H225M218 6H225"/>
      <text x="120" y="43" class="stage">Verilog / FPGA</text>
      <text x="120" y="70" class="hint">streaming RTL</text>
    </g>

    <g transform="translate(272 0)">
      <rect class="card" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">06</text>
      <circle class="badge2" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <rect x="184" y="-12" width="44" height="25" rx="5" fill="#12395a" stroke="#86e6ff" stroke-width="2"/>
      <path class="mini2" d="M188 3 C195 -11 202 14 209 3 S223 -11 228 3"/>
      <text x="120" y="43" class="stage">Verification</text>
      <text x="120" y="70" class="hint">model / C++ / RTL</text>
    </g>

    <g transform="translate(544 0)">
      <rect class="final" width="240" height="86" rx="18"/>
      <circle class="badge" cx="31" cy="0" r="16"/><text class="num" x="31" y="0">07</text>
      <circle class="badge2" cx="206" cy="0" r="18" fill-opacity="0.35"/>
      <path class="mini" d="M188 0H224M206 -15V15"/>
      <circle class="dot" cx="197" cy="-8" r="3"/><circle class="dot" cx="215" cy="-8" r="3"/>
      <circle class="dot2" cx="197" cy="9" r="3"/><circle class="dot2" cx="215" cy="9" r="3"/>
      <text x="120" y="43" class="stage">Metrics</text>
      <text x="120" y="70" class="hint">BER / EVM / SNR</text>
    </g>

    <path class="arrow" d="M246 43 H262"/>
    <path class="arrow" d="M518 43 H534"/>
  </g>

  <text x="64" y="410" class="footerStrong">Core idea:</text>
  <text x="156" y="410" class="footer">keep algorithms, software, hardware and measurements aligned by reproducible evidence.</text>
</svg>