<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.45" stop-color="#0a1d35"/>
      <stop offset="1" stop-color="#102b4a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 170) rotate(35) scale(560 280)">
      <stop stop-color="#1bb6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1bb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 340) rotate(-20) scale(520 260)">
      <stop stop-color="#7c5cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7adfff"/>
    </marker>
    <style>
      .title{font:700 36px DejaVu Sans, Arial, sans-serif;fill:#ecfbff}
      .subtitle{font:400 19px DejaVu Sans, Arial, sans-serif;fill:#abdff5}
      .blockTitle{font:700 22px DejaVu Sans, Arial, sans-serif;fill:#effbff;text-anchor:middle}
      .desc{font:400 14px DejaVu Sans, Arial, sans-serif;fill:#b8d8e8;text-anchor:middle}
      .num{font:700 12px DejaVu Sans, Arial, sans-serif;fill:#eefcff;text-anchor:middle}
      .small{font:400 15px DejaVu Sans, Arial, sans-serif;fill:#c9c5ff}
      .footerStrong{font:700 18px DejaVu Sans, Arial, sans-serif;fill:#effbff}
      .footer{font:400 18px DejaVu Sans, Arial, sans-serif;fill:#bddff0}
      .card{fill:#0e2742;stroke:#5ccfff;stroke-width:2;filter:url(#shadow)}
      .pill{fill:#1f6f97;fill-opacity:.55;stroke:#75dfff;stroke-opacity:.65}
      .line{stroke:#7adfff;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .feedback{stroke:#b093ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .icon{stroke:#7ee4ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .icon2{stroke:#a987ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .muted{stroke:#7ee4ff;stroke-opacity:.35;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="520" rx="0" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#glow1)"/>
  <rect width="1600" height="520" fill="url(#glow2)"/>

  <g opacity="0.23">
    <path d="M0 70H1600M0 120H1600M0 170H1600M0 220H1600M0 270H1600M0 320H1600M0 370H1600M0 420H1600M0 470H1600" stroke="#70cfff"/>
    <path d="M50 0V520M100 0V520M150 0V520M200 0V520M250 0V520M300 0V520M350 0V520M400 0V520M450 0V520M500 0V520M550 0V520M600 0V520M650 0V520M700 0V520M750 0V520M800 0V520M850 0V520M900 0V520M950 0V520M1000 0V520M1050 0V520M1100 0V520M1150 0V520M1200 0V520M1250 0V520M1300 0V520M1350 0V520M1400 0V520M1450 0V520M1500 0V520M1550 0V520" stroke="#70cfff"/>
  </g>

  <rect x="18" y="18" width="1564" height="484" rx="24" stroke="#5ccfff" stroke-opacity="0.25" stroke-width="2"/>
  <text x="54" y="67" class="title">Engineering Pipeline</text>
  <text x="56" y="103" class="subtitle">from signal model to hardware verification and publication-ready metrics</text>

  <!-- Cards -->
  <g id="cards" transform="translate(56 184)">
    <!-- 1 -->
    <g transform="translate(0 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">01</text>
      <path class="icon" d="M61 50 C72 24 82 76 93 50 S114 24 125 50 S146 76 157 50"/>
      <path class="muted" d="M58 50H160"/>
      <text class="blockTitle" x="101" y="105">Signal / RF</text>
      <text class="desc" x="101" y="126">channel, impairments</text><text class="desc" x="101" y="143">constraints</text>
    </g>
    <!-- 2 -->
    <g transform="translate(220 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">02</text>
      <path class="icon" d="M62 74H150M62 74V28"/>
      <path class="icon2" d="M68 65 L88 52 L108 57 L128 38 L148 30"/>
      <circle cx="88" cy="52" r="3" fill="#7ee4ff"/><circle cx="108" cy="57" r="3" fill="#7ee4ff"/><circle cx="128" cy="38" r="3" fill="#7ee4ff"/>
      <text class="blockTitle" x="101" y="105">MATLAB Model</text>
      <text class="desc" x="101" y="126">golden reference</text><text class="desc" x="101" y="143">plots, diagnostics</text>
    </g>
    <!-- 3 -->
    <g transform="translate(440 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">03</text>
      <text x="56" y="67" style="font:700 44px DejaVu Sans,Arial;fill:#7ee4ff">{ }</text>
      <circle class="icon" cx="130" cy="52" r="16"/><path class="icon" d="M130 27V34M130 70V77M105 52H112M148 52H155M112 34L117 39M143 65L148 70M112 70L117 65M143 39L148 34"/>
      <text class="blockTitle" x="101" y="105">C++ DSP</text>
      <text class="desc" x="101" y="126">deterministic core</text><text class="desc" x="101" y="143">tests, CLI</text>
    </g>
    <!-- 4 -->
    <g transform="translate(660 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">04</text>
      <text x="62" y="43" style="font:400 15px DejaVu Sans,Arial;fill:#7ee4ff">0 1 0 1 1</text>
      <text x="62" y="62" style="font:400 15px DejaVu Sans,Arial;fill:#7ee4ff">1 0 1 0 0</text>
      <text x="62" y="81" style="font:400 15px DejaVu Sans,Arial;fill:#7ee4ff">Q1.15</text>
      <text class="blockTitle" x="101" y="105">Fixed-Point</text>
      <text class="desc" x="101" y="126">Q-format, saturation</text><text class="desc" x="101" y="143">error budget</text>
    </g>
    <!-- 5 -->
    <g transform="translate(880 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">05</text>
      <rect x="70" y="29" width="62" height="52" rx="6" fill="#143c5f" stroke="#7ee4ff" stroke-width="3"/>
      <path class="icon" d="M58 38H70M58 48H70M58 58H70M58 68H70M132 38H144M132 48H144M132 58H144M132 68H144M82 20V29M96 20V29M110 20V29M124 20V29M82 81V90M96 81V90M110 81V90M124 81V90"/>
      <text x="88" y="61" style="font:700 13px DejaVu Sans,Arial;fill:#effbff">RTL</text>
      <text class="blockTitle" x="101" y="105">Verilog / FPGA</text>
      <text class="desc" x="101" y="126">streaming RTL</text><text class="desc" x="101" y="143">testbenches</text>
    </g>
    <!-- 6 -->
    <g transform="translate(1100 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">06</text>
      <rect x="59" y="28" width="84" height="56" rx="8" fill="#143c5f" stroke="#7ee4ff" stroke-width="3"/>
      <path class="icon2" d="M70 57 C80 35 90 78 101 57 S124 36 135 57"/>
      <circle cx="132" cy="74" r="4" fill="#7ee4ff"/>
      <text class="blockTitle" x="101" y="105">Measurement</text>
      <text class="desc" x="101" y="126">real/synthetic</text><text class="desc" x="101" y="143">verification</text>
    </g>
    <!-- 7 -->
    <g transform="translate(1320 0)">
      <rect class="card" width="202" height="142" rx="18"/>
      <rect class="pill" x="12" y="12" width="34" height="26" rx="13"/><text class="num" x="29" y="30">07</text>
      <path class="muted" d="M58 55H144M101 19V88"/>
      <circle cx="79" cy="39" r="4" fill="#7ee4ff"/><circle cx="123" cy="39" r="4" fill="#7ee4ff"/><circle cx="79" cy="72" r="4" fill="#7ee4ff"/><circle cx="123" cy="72" r="4" fill="#7ee4ff"/>
      <circle cx="83" cy="43" r="2" fill="#a987ff"/><circle cx="119" cy="36" r="2" fill="#a987ff"/><circle cx="76" cy="68" r="2" fill="#a987ff"/><circle cx="126" cy="75" r="2" fill="#a987ff"/>
      <text class="blockTitle" x="101" y="105">BER / EVM / SNR</text>
      <text class="desc" x="101" y="126">reports, conclusions</text><text class="desc" x="101" y="143">publication artifacts</text>
    </g>

    <!-- Arrows -->
    <path class="line" d="M206 71 H214"/><path class="line" d="M426 71 H434"/><path class="line" d="M646 71 H654"/><path class="line" d="M866 71 H874"/><path class="line" d="M1086 71 H1094"/><path class="line" d="M1306 71 H1314"/>

    <!-- Feedback loop -->
    <path class="feedback" d="M1421 155 V195 H321 V155"/>
    <text x="343" y="207" class="small">feedback: measurements refine model and implementation</text>
  </g>

  <text x="58" y="472" class="footerStrong">Core idea:</text>
  <text x="165" y="472" class="footer">reproducible DSP systems where algorithms, software, hardware and metrics stay aligned</text>
</svg>
