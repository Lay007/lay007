<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering pipeline</title>
  <desc id="desc">Compact DSP and FPGA engineering pipeline from RF problem to verified metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0a2038"/>
      <stop offset="1" stop-color="#102d4d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 105) rotate(25) scale(470 220)">
      <stop stop-color="#1bb6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1bb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 365) rotate(-20) scale(430 220)">
      <stop stop-color="#7c5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7 Z" fill="#86e6ff"/>
    </marker>
    <filter id="shadow" x="-6%" y="-10%" width="112%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font:800 36px Arial,DejaVu Sans,sans-serif;fill:#f1fbff}
      .subtitle{font:400 17px Arial,DejaVu Sans,sans-serif;fill:#b9e7f7}
      .card{fill:#0e2946;stroke:#67d8ff;stroke-width:2;filter:url(#shadow)}
      .final{fill:#14284d;stroke:#b09aff;stroke-width:2;filter:url(#shadow)}
      .chip{fill:#1a6f98;stroke:#85e6ff;stroke-width:1.2}
      .num{font:800 13px Arial,DejaVu Sans,sans-serif;fill:#f5fdff;text-anchor:middle;dominant-baseline:middle}
      .stage{font:800 22px Arial,DejaVu Sans,sans-serif;fill:#f4fcff;text-anchor:middle}
      .hint{font:400 14px Arial,DejaVu Sans,sans-serif;fill:#c9e4f0;text-anchor:middle}
      .arrow{stroke:#86e6ff;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .footerStrong{font:800 16px Arial,DejaVu Sans,sans-serif;fill:#f4fcff}
      .footer{font:400 16px Arial,DejaVu Sans,sans-serif;fill:#c7e6f2}
      .grid{stroke:#70cfff;stroke-opacity:.10;stroke-width:1}
      .mini{stroke:#86e6ff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .mini2{stroke:#b59cff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .dot{fill:#86e6ff}
      .dot2{fill:#b59cff}
      .qtxt{font:800 16px Arial,DejaVu Sans,sans-serif;fill:#b59cff;text-anchor:middle;dominant-baseline:middle}
      .code{font:800 21px Arial,DejaVu Sans,sans-serif;fill:#86e6ff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#glowA)"/>
  <rect width="1200" height="460" fill="url(#glowB)"/>
  <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
  <path class="grid" d="M80 0V460M160 0V460M240 0V460M320 0V460M400 0V460M480 0V460M560 0V460M640 0V460M720 0V460M800 0V460M880 0V460M960 0V460M1040 0V460M1120 0V460"/>
  <rect x="24" y="24" width="1152" height="412" rx="26" stroke="#67d8ff" stroke-opacity="0.28" stroke-width="2"/>

  <text x="64" y="72" class="title">Engineering Pipeline</text>
  <text x="66" y="101" class="subtitle">model → software → fixed-point → FPGA → measurement → metrics</text>

  <g transform="translate(72 135)">
    <g>
      <rect class="card" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">01</text>
      <path class="mini" d="M174 30 C183 17 192 43 201 30 S219 17 228 30"/>
      <text x="120" y="58" class="stage">Signal / RF</text>
      <text x="120" y="80" class="hint">problem definition</text>
    </g>

    <g transform="translate(272 0)">
      <rect class="card" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">02</text>
      <path class="mini" d="M176 39H228M176 39V17"/><path class="mini2" d="M181 34 L193 27 L205 31 L217 21 L228 18"/>
      <text x="120" y="58" class="stage">MATLAB</text>
      <text x="120" y="80" class="hint">golden reference</text>
    </g>

    <g transform="translate(544 0)">
      <rect class="card" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">03</text>
      <text class="code" x="202" y="29">{ }</text>
      <circle class="mini" cx="226" cy="29" r="9"/>
      <text x="120" y="58" class="stage">C++ DSP</text>
      <text x="120" y="80" class="hint">tests and benchmarks</text>
    </g>

    <g transform="translate(816 0)">
      <rect class="card" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">04</text>
      <circle class="mini2" cx="200" cy="29" r="15"/>
      <text class="qtxt" x="200" y="29">Q</text>
      <path class="mini" d="M220 20V38"/>
      <text x="120" y="58" class="stage">Fixed-point</text>
      <text x="120" y="80" class="hint">error budget</text>
    </g>

    <path class="arrow" d="M246 46 H262"/>
    <path class="arrow" d="M518 46 H534"/>
    <path class="arrow" d="M790 46 H806"/>
  </g>

  <path class="arrow" d="M1008 235 V267 H936"/>

  <g transform="translate(208 282)">
    <g>
      <rect class="card" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">05</text>
      <rect x="184" y="17" width="32" height="26" rx="5" fill="#12395a" stroke="#86e6ff" stroke-width="2"/>
      <path class="mini" d="M176 22H184M176 30H184M176 38H184M216 22H224M216 30H224M216 38H224"/>
      <text x="120" y="58" class="stage">Verilog / FPGA</text>
      <text x="120" y="80" class="hint">streaming RTL</text>
    </g>

    <g transform="translate(272 0)">
      <rect class="card" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">06</text>
      <rect x="176" y="16" width="54" height="32" rx="5" fill="#12395a" stroke="#86e6ff" stroke-width="2"/>
      <path class="mini2" d="M181 35 C190 18 199 48 208 35 S225 18 230 35"/>
      <text x="120" y="58" class="stage">Verification</text>
      <text x="120" y="80" class="hint">model / C++ / RTL</text>
    </g>

    <g transform="translate(544 0)">
      <rect class="final" width="240" height="92" rx="18"/>
      <rect class="chip" x="18" y="18" width="34" height="26" rx="13"/><text class="num" x="35" y="31">07</text>
      <path class="mini" d="M176 32H229M202 14V49"/>
      <circle class="dot" cx="188" cy="23" r="3.5"/><circle class="dot" cx="216" cy="23" r="3.5"/>
      <circle class="dot2" cx="188" cy="41" r="3.5"/><circle class="dot2" cx="216" cy="41" r="3.5"/>
      <text x="120" y="58" class="stage">Metrics</text>
      <text x="120" y="80" class="hint">BER / EVM / SNR</text>
    </g>

    <path class="arrow" d="M246 46 H262"/>
    <path class="arrow" d="M518 46 H534"/>
  </g>

  <text x="64" y="410" class="footerStrong">Core idea:</text>
  <text x="156" y="410" class="footer">keep algorithms, software, hardware and measurements aligned by reproducible evidence.</text>
</svg>